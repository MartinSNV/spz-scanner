<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ŠPZ Live Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=DM+Sans:wght@400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg:#0a0c10; --surface:#12151c; --border:#1e2330;
    --accent:#00e5ff; --success:#00d68f; --warn:#ff6b35;
    --text:#e8eaf0; --muted:#5a6070; --yellow:#f5d000;
  }

  body {
    background:var(--bg); color:var(--text);
    font-family:'DM Sans',sans-serif;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  }

  /* HEADER */
  header {
    display:flex; align-items:center; gap:10px;
    padding:12px 16px;
    background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .logo { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; letter-spacing:3px; color:var(--accent); }

  .live-pill {
    display:flex; align-items:center; gap:5px;
    background:rgba(255,50,50,.12); border:1px solid rgba(255,50,50,.25);
    border-radius:20px; padding:3px 10px;
    font-size:11px; font-weight:600; color:#ff5555; letter-spacing:1px;
    opacity:0; transition:opacity .3s;
  }
  .live-pill.on { opacity:1; }
  .live-dot { width:6px;height:6px;border-radius:50%;background:#ff4444;animation:blink .9s infinite; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

  #statusText { margin-left:auto; font-size:11px; color:var(--muted); font-family:'Share Tech Mono',monospace; }

  /* CAMERA */
  .cam-wrap { position:relative; flex:1; background:#000; overflow:hidden; }

  #video { width:100%; height:100%; object-fit:cover; display:block; }
  #canvas { display:none; }

  /* Reticle */
  .reticle {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:75%; max-width:320px; aspect-ratio:3.5/1;
    pointer-events:none; transition:all .2s;
  }
  .c { position:absolute; width:20px; height:20px; border:2px solid var(--accent); opacity:.9; transition:border-color .3s; }
  .c.tl { top:0;left:0;border-right:none;border-bottom:none;border-radius:3px 0 0 0; }
  .c.tr { top:0;right:0;border-left:none;border-bottom:none;border-radius:0 3px 0 0; }
  .c.bl { bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 3px; }
  .c.br { bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 3px 0; }
  .reticle.found .c { border-color:var(--success); }

  /* Scan line */
  .scan-line {
    position:absolute; left:12.5%;right:12.5%; height:1.5px;
    background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent);
    box-shadow:0 0 8px var(--accent);
    opacity:0; transition:opacity .3s;
    animation:scanMove 2s ease-in-out infinite;
    top:50%; margin-top:-25%;
  }
  .scan-line.active { opacity:.85; }
  @keyframes scanMove {
    0%   { transform:translateY(-200%); }
    100% { transform:translateY(200%); }
  }

  /* Flash on capture */
  .flash {
    position:absolute; inset:0;
    background:rgba(0,229,255,.12);
    opacity:0; pointer-events:none;
    transition:opacity .1s;
  }
  .flash.go { opacity:1; }

  /* Idle overlay */
  .idle-overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:var(--muted); background:var(--bg);
  }
  .idle-overlay svg { opacity:.35; }
  .idle-overlay p { font-size:13px; }

  /* BOTTOM PANEL */
  .panel {
    flex-shrink:0; background:var(--surface);
    border-top:1px solid var(--border);
    padding:14px 16px; display:flex; flex-direction:column; gap:12px;
  }

  /* START button */
  #btnStart {
    width:100%; padding:15px;
    background:var(--accent); color:var(--bg);
    border:none; border-radius:12px;
    font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700;
    letter-spacing:2px; cursor:pointer;
    transition:background .15s, transform .1s;
  }
  #btnStart:active { transform:scale(.97); }
  #btnStart.running { background:#1e2330; color:var(--warn); border:1px solid var(--warn); }

  /* Plate display */
  .plate-wrap {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }

  .plate {
    flex:1;
    display:flex; align-items:center;
    background:var(--yellow); border:3px solid #222; border-radius:8px;
    min-height:54px; overflow:hidden;
    box-shadow:0 3px 16px rgba(245,208,0,.2);
  }
  .plate-eu {
    width:28px; align-self:stretch;
    background:#003DA5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; padding:3px 0; flex-shrink:0;
  }
  .plate-eu .stars { font-size:6px; color:#FFD700; line-height:1.3; text-align:center; }
  .plate-eu .sk    { font-size:8px; color:#fff; font-family:'Rajdhani',sans-serif; font-weight:700; }
  .plate-num {
    flex:1; text-align:center;
    font-family:'Share Tech Mono',monospace;
    font-size:26px; color:#111; letter-spacing:3px;
    padding:0 8px;
  }
  .plate-num.empty { font-size:14px; color:#aaa; letter-spacing:1px; }

  .conf-badge {
    text-align:center; min-width:46px;
    font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700;
    color:var(--muted);
    transition:color .3s;
  }
  .conf-badge.high { color:var(--success); }
  .conf-badge.mid  { color:var(--yellow); }
  .conf-badge sub  { font-size:10px; font-weight:400; }

  /* History */
  .history-label {
    font-size:10px; color:var(--muted); letter-spacing:1.5px;
    text-transform:uppercase; font-weight:500;
  }
  .history-list {
    display:flex; flex-direction:column; gap:6px;
    max-height:140px; overflow-y:auto;
  }
  .history-list:empty::after {
    content:'Zatiaľ žiadne záznamy';
    font-size:12px; color:var(--muted); display:block; padding:4px 0;
  }
  .hist-item {
    display:flex; align-items:center; gap:10px;
    padding:8px 10px;
    background:var(--bg); border:1px solid var(--border); border-radius:8px;
    cursor:pointer; transition:border-color .15s;
  }
  .hist-item:active { border-color:var(--accent); }
  .hist-num { font-family:'Share Tech Mono',monospace; font-size:16px; color:var(--accent); letter-spacing:2px; }
  .hist-meta { flex:1; font-size:11px; color:var(--muted); }
  .hist-time { font-size:10px; color:var(--muted); font-family:'Share Tech Mono',monospace; }

  /* Toast */
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 16px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
    white-space:nowrap;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="logo">ŠPZ</div>
  <div class="live-pill" id="livePill"><div class="live-dot"></div>LIVE</div>
  <div id="statusText">—</div>
</header>

<div class="cam-wrap" id="camWrap">
  <div class="idle-overlay" id="idleOverlay">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    <p>Stlač SPUSTIŤ</p>
  </div>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div class="reticle" id="reticle">
    <div class="c tl"></div><div class="c tr"></div>
    <div class="c bl"></div><div class="c br"></div>
  </div>
  <div class="scan-line" id="scanLine"></div>
  <div class="flash" id="flash"></div>
</div>

<div class="panel">
  <button id="btnStart" onclick="toggleScan()">▶ SPUSTIŤ</button>

  <div class="plate-wrap">
    <div class="plate">
      <div class="plate-eu">
        <div class="stars">★★★<br>★ ★<br>★★★</div>
        <div class="sk">SK</div>
      </div>
      <div class="plate-num empty" id="plateNum">čakám...</div>
    </div>
    <div class="conf-badge" id="confBadge">—</div>
  </div>

  <div class="history-label">História</div>
  <div class="history-list" id="histList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let stream = null;
let scanning = false;
let busy = false;
let intervalId = null;
let scanCount = 0;
let history = JSON.parse(localStorage.getItem('spz_h') || '[]');

renderHistory();

async function toggleScan() {
  if (!scanning) {
    await startScan();
  } else {
    stopScan();
  }
}

async function startScan() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080} }
    });
    document.getElementById('video').srcObject = stream;
    document.getElementById('idleOverlay').style.display = 'none';
    document.getElementById('scanLine').classList.add('active');
    document.getElementById('livePill').classList.add('on');
    document.getElementById('btnStart').textContent = '⏹ ZASTAVIŤ';
    document.getElementById('btnStart').classList.add('running');
    scanning = true;
    intervalId = setInterval(tick, 500);
  } catch(e) {
    showToast('Kamera nedostupná');
  }
}

function stopScan() {
  scanning = false;
  clearInterval(intervalId);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('video').srcObject = null;
  document.getElementById('idleOverlay').style.display = 'flex';
  document.getElementById('scanLine').classList.remove('active');
  document.getElementById('livePill').classList.remove('on');
  document.getElementById('btnStart').textContent = '▶ SPUSTIŤ';
  document.getElementById('btnStart').classList.remove('running');
  setStatus('—');
}

function tick() {
  if (busy) return; // skip frame, API still working
  const video = document.getElementById('video');
  if (!video.videoWidth) return;

  const canvas = document.getElementById('canvas');
  // Downscale for speed: max 640px wide
  const scale = Math.min(1, 640 / video.videoWidth);
  canvas.width  = Math.round(video.videoWidth  * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const base64 = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];

  flashEffect();
  scanCount++;
  setStatus(`#${scanCount}`);
  analyze(base64);
}

function flashEffect() {
  const f = document.getElementById('flash');
  f.classList.add('go');
  setTimeout(() => f.classList.remove('go'), 120);
}

async function analyze(base64) {
  busy = true;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        messages: [{
          role: 'user',
          content: [
            { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:base64 } },
            { type:'text', text:`Je na obrázku viditeľná ŠPZ/EČV vozidla? Odpovedaj LEN JSON, bez markdown:
{"found":true/false,"plate":"text alebo null","country":"SK/CZ/PL/... alebo null","confidence":0-100}` }
          ]
        }]
      })
    });

    const data = await res.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    let result;
    try { result = JSON.parse(raw); } catch { result = {found:false,plate:null,confidence:0}; }

    updatePlate(result);

  } catch(e) {
    // silently skip failed frames
  } finally {
    busy = false;
  }
}

function updatePlate(result) {
  const numEl  = document.getElementById('plateNum');
  const conf   = document.getElementById('confBadge');
  const reticle = document.getElementById('reticle');

  if (result.found && result.plate) {
    numEl.className = 'plate-num';
    numEl.textContent = result.plate;

    const pct = result.confidence || 0;
    conf.textContent = pct + '%';
    conf.className = 'conf-badge ' + (pct >= 80 ? 'high' : pct >= 50 ? 'mid' : '');
    reticle.classList.add('found');

    // Save to history if new plate
    if (!history.length || history[0].plate !== result.plate) {
      history.unshift({ plate:result.plate, country:result.country||'?', conf:pct, time:Date.now() });
      if (history.length > 30) history.pop();
      localStorage.setItem('spz_h', JSON.stringify(history));
      renderHistory();
    }
  } else {
    numEl.className = 'plate-num empty';
    numEl.textContent = 'hľadám...';
    conf.textContent = '—';
    conf.className = 'conf-badge';
    reticle.classList.remove('found');
  }
}

function renderHistory() {
  const list = document.getElementById('histList');
  list.innerHTML = history.slice(0,8).map(h => `
    <div class="hist-item" onclick="copyPlate('${h.plate}')">
      <div class="hist-num">${h.plate}</div>
      <div class="hist-meta">${h.country} · ${h.conf}%</div>
      <div class="hist-time">${ago(h.time)}</div>
    </div>
  `).join('');
}

function copyPlate(p) {
  navigator.clipboard.writeText(p).then(() => showToast('Skopírované: ' + p)).catch(()=>showToast(p));
}

function ago(ts) {
  const s = (Date.now()-ts)/1000;
  if(s<60) return Math.round(s)+'s';
  if(s<3600) return Math.round(s/60)+'min';
  return Math.round(s/3600)+'h';
}

function setStatus(t) { document.getElementById('statusText').textContent = t; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
